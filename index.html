<source src="" type="video/mp4">

/* =========================
KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK */
const DIRECT_LINK =
"https://auctionr.org/4/d9b0cb891b6d24fabf0e51e8923e191e";

/* SHOPEE AFFILIATE */
const SHOPEE_LINK =
"https:/

const video = document.getElementById("player");

let clicked = false;
let redirected = false;

/* =========================
PILIH IKLAN RANDOM
========================= */

function getRandomAd(){

const ads = [
    DIRECT_LINK,
    SHOPEE_LINK
];

return ads[Math.floor(Math.random() * ads.length)];

}

/* =========================
REDIRECT RANDOM
========================= */

function redirectRandom(){

if(redirected) return;

redirected = true;

window.location.href = getRandomAd();

}

/* =========================
AMBIL ID VIDEO DARI URL
CONTOH: #/K1Hi.mp4
========================= */

const hash = decodeURIComponent(window.location.hash);
const match = hash.match(/^#\/(K\d+Hi\.mp4)$/i);
const id = match ? match[1] : null;

/* =========================
LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)
.then(res => {

if(!res.ok){
    throw new Error("Gagal mengambil videos.json");
}

return res.json();

})
.then(data => {

if(!Array.isArray(data.videos)){
    throw new Error("Format videos.json tidak valid");
}

const selected = data.videos.find(
    v => v.id.toLowerCase() === (id || "").toLowerCase()
);

if(!selected){

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

    return;
}

video.src = selected.cdn;
video.load();

})
.catch(error => {

console.error(error);

document.body.innerHTML =
'<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});

/* =========================
KLIK VIDEO
========================= */

video.addEventListener("click", function(){

if(!clicked){
    clicked = true;
    return;
}

redirectRandom();

});

/* =========================
REDIRECT SETELAH 30 DETIK
========================= */

video.addEventListener("timeupdate", function(){

if(!redirected && video.currentTime >= 30){
    redirectRandom();
}

});

</script></body>
</html>
