<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;z-index:10}
</style>
</head>

<body>

<p id="title">Memuat...</p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="" type="video/mp4">
</video>

<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://hai8g.com/4/10961092";

const video = document.getElementById("player");
const title = document.getElementById("title");

let clicked = false;
let redirected = false;

// Fungsi cerdas untuk mengambil ID dari URL apapun bentuknya
function getIDFromURL() {
  // Cek apakah pakai format ?id=31
  const queryParams = new URLSearchParams(window.location.search);
  let id = queryParams.get("id");
  
  // Jika tidak ada, cek apakah pakai format hash #31 atau #/31
  if (!id) {
    id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  }
  
  // Bersihkan tanda garis miring (/) yang mungkin tersisa
  return id.replace(/\//g, "").trim();
}

fetch(JSON_URL)
.then(res => res.json())
.then(data => {

  const vids = data.videos;
  const urlParam = getIDFromURL();

  // Cari video berdasarkan ID atau Nama di JSON
  let selected = vids.find(v => String(v.id) === urlParam || String(v.name) === urlParam);

  // Jika tetap tidak ditemukan, pakai video index pertama (ID 1)
  if (!selected) {
    console.warn("Video dengan ID " + urlParam + " tidak ditemukan di JSON. Menggunakan video pertama.");
    selected = vids[0];
  }

  video.src = selected.cdn;
  title.innerText = selected.name || `Video ID: ${selected.id}`;

})
.catch(err => {
  console.error("Gagal membaca videos.json:", err);
  title.innerText = "Gagal memuat data.";
});

// Event ketika layar diklik
video.addEventListener("click", () => {
  if (!clicked) {
    clicked = true;
    window.location.href = DIRECT_LINK;
  }
}, { once: true });

// Event pengalihan setelah 30 detik diputar
video.addEventListener("timeupdate", () => {
  if (!redirected && video.currentTime >= 30){
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});
</script>

</body>
</html>
