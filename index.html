<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="" type="video/mp4">
</video>

<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://omg10.com/4/10960953";

const video = document.getElementById("player");
const title = document.getElementById("title");

let clicked = false;
let redirected = false;

fetch(JSON_URL)
.then(res => res.json())
.then(data => {

  const vids = data.videos;

  // Ambil nama file dari URL
  // Contoh: https://cdn.slicedrive.it.com/K1Hi.mp4
  const name = decodeURIComponent(
    location.pathname.split("/").pop()
  );

  // Mendukung "id" maupun "name"
  let selected = vids.find(v => v.id === name || v.name === name);

  // Fallback ke video pertama
  if (!selected) {
    selected = vids[0];
  }

  video.src = selected.cdn;
  title.textContent = selected.id || selected.name;

  video.play().catch(() => {});
});

video.addEventListener("click", () => {
  if (!clicked) {
    clicked = true;
    window.location.href = DIRECT_LINK;
  }
}, { once: true });

video.addEventListener("timeupdate", () => {
  if (!redirected && video.currentTime >= 30) {
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});
</script>

</body>
</html>
